[build-system]
requires = ["setuptools==75.8.0"]

[project]
name = "ina228"
version = "0.0.4"
authors = [
  { name="Andrey Zaostrovnykh", email="megalloid@gmail.com" },
  { name="Igor Molchanov", email="akemi_homura@kurisa.ch" },
]
maintainers = [
  { name="Igor Molchanov", email="akemi_homura@kurisa.ch" },
]
description = "Driver for TI INA228 with SMBUS"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["electronics", "sensing", "TI", "home automation", "smbus", "ina2xx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE*"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Repository = "https://github.com/makise-homura/INA228/"
Issues = "https://github.com/makise-homura/INA228/issues/"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests/test.py"]
